[project]
name = "corp-default"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.1",
    "numpy>=2.3.5",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "torch>=2.15.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.2",
    "jupytext>=1.19.6",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "pillow>=12.3.0",
    "playwright>=1.65.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' -p no:anyio"
markers = [
    "needs_data: requires data/american_bankruptcy.csv",
    "integration: slow end-to-end checks, run explicitly with -m integration",
]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks", "corp_default.ipynb"]

[tool.ruff.lint.per-file-ignores]
"chapters/*.py" = ["E402"]
